<article class="entry">
  <span class="entry__date">{{date}}</span>
  <h3 class="entry__title">{{title}}</h3>
  <p class="entry__where">{{where}}</p>
  <p class="entry__body">{{body}}</p>
  <div class="entry__out">
    <span class="micro">{{out}}</span>
    <a class="source-link" href="{{href}}" target="_blank" rel="noopener">Official record <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M7 7h10v10"/></svg></span></a>
  </div>
</article>
