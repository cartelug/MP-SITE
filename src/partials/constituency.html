<figure class="cmap">
  <svg class="cmap__svg" viewBox="0 0 720 560" role="img"
       aria-labelledby="cmap-title cmap-desc">
    <title id="cmap-title">Budadiri County East within Sironko District</title>
    <desc id="cmap-desc">
      A schematic of Sironko District divided into Budadiri County West and
      Budadiri County East by a river. The eastern county rises onto the
      Mount Elgon massif and contains Budadiri Town, the coffee-growing
      highlands, the Sasa trail head, and the district's trading centres.
    </desc>

    <!-- district outline -->
    <path class="cmap__district"
      d="M150 150C190 95 300 70 380 82C450 92 520 78 575 110C630 142 660 200 655 265C650 330 610 395 545 440C480 485 400 505 330 495C260 485 200 450 168 395C136 340 120 240 150 150Z"/>

    <!-- the eastern county, the constituency this office represents -->
    <path class="cmap__east"
      d="M378 84C392 150 360 190 380 240C400 290 366 330 392 380C412 420 396 460 404 498C460 500 500 470 545 440C610 395 650 330 655 265C660 200 630 142 575 110C520 78 450 92 380 82Z"/>

    <!-- Mount Elgon: the same contour language used across the site -->
    <g class="cmap__elgon">
      <ellipse cx="596" cy="232" rx="66" ry="52" transform="rotate(-14 596 232)"/>
      <ellipse cx="596" cy="232" rx="48" ry="37" transform="rotate(-14 596 232)"/>
      <ellipse cx="596" cy="232" rx="30" ry="23" transform="rotate(-14 596 232)"/>
      <ellipse cx="596" cy="232" rx="13" ry="10" transform="rotate(-14 596 232)"/>
    </g>

    <!-- the river that forms the county boundary -->
    <path class="cmap__river"
      d="M378 84C392 150 360 190 380 240C400 290 366 330 392 380C412 420 396 460 404 498"/>

    <!-- the road spine -->
    <path class="cmap__road" d="M330 470C380 420 430 380 470 320C505 268 540 232 590 208"/>

    <g class="cmap__marks">
      <g transform="translate(452,330)"><circle r="4.5"/><text x="12" y="4">Budadiri Town</text></g>
      <g transform="translate(504,272)"><circle r="3"/><text x="11" y="4">Health centre</text></g>
      <g transform="translate(586,196)"><circle r="3"/><text x="11" y="4">Sasa trail head</text></g>
      <g transform="translate(542,368)"><circle r="3"/><text x="11" y="4">Coffee highlands</text></g>
      <g transform="translate(408,424)"><circle r="3"/><text x="11" y="4">Markets &amp; trading centres</text></g>
    </g>

    <text class="cmap__region cmap__region--peak" x="566" y="312" text-anchor="middle">Mount Elgon</text>
    <text class="cmap__region" x="238" y="300">Budadiri<tspan x="238" dy="19">County West</tspan></text>
    <text class="cmap__region cmap__region--east" x="470" y="146">Budadiri<tspan x="470" dy="21">County East</tspan></text>
  </svg>

  <figcaption class="figure__caption">
    <span class="micro">Schematic &middot; not to scale</span>
    <span class="caption">
      Sironko District, divided into two counties by the river. Budadiri East
      is the eastern half, rising from the trading centres onto the Mount Elgon
      massif &mdash; which is why roads, landslides and coffee are the same
      conversation here.
    </span>
  </figcaption>
</figure>
