<div class="stage stage--doc" data-stage>
  <span class="stage__dot" aria-hidden="true"></span>
  <span class="stage__scale">{{scale}}</span>
  <div>
    <h3 class="stage__name">{{name}}</h3>
    <p class="stage__note">{{note}}</p>
  </div>
  <a class="source-link stage__doc" href="{{href}}" download>{{docLabel}} <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span></a>
</div>
